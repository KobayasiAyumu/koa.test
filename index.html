<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Routine</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --hour-height: 50px;
            --header-height: 40px;
            --primary-color: #4b6cb7;
            --border-color: #ddd;
            --bg-color: #f4f7f6;
        }

        body { font-family: "Helvetica Neue", Arial, sans-serif; color: #333; margin: 0; padding: 20px; background-color: var(--bg-color); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }

        /* コントロールエリア */
        .controls { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 30px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; gap: 5px; }
        button:active { transform: scale(0.95); }
        .btn-add { background-color: var(--primary-color); }
        .btn-save { background-color: #27ae60; }
        .btn-clear { background-color: #e74c3c; }
        .btn-category { background-color: #8e44ad; }

        /* スケジュールラッパー（スクロール用） */
        .schedule-wrapper {
            background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: auto; position: relative; max-width: 1200px; margin: 0 auto; 
            border: 1px solid var(--border-color);
            max-height: 85vh; /* 画面からはみ出さないように */
        }
        
        .schedule-container {
            display: flex; 
            min-width: 800px; 
            position: relative;
        }

        /* 時間軸 */
        .time-column { width: 60px; background-color: #fafafa; border-right: 1px solid var(--border-color); flex-shrink: 0; z-index: 20; position: sticky; left: 0;}
        /* ヘッダーの高さ合わせ */
        .time-header-spacer { height: var(--header-height); border-bottom: 1px solid var(--border-color); background-color: #f4f4f4; box-sizing: border-box; position: sticky; top: 0; z-index: 30; }
        
        .time-slot { 
            height: var(--hour-height); box-sizing: border-box; position: relative; 
            border-bottom: 1px solid transparent;
        }
        .time-slot span {
            position: absolute; top: 0; right: 8px; transform: translateY(-50%);
            background: #fafafa; padding: 0 2px; font-size: 11px; color: #999; z-index: 2; line-height: 1;
        }

        /* 曜日エリア */
        .days-area { flex-grow: 1; display: flex; position: relative; }
        .day-column { flex: 1; border-right: 1px solid var(--border-color); position: relative; min-width: 100px; }
        
        .day-header {
            height: var(--header-height); text-align: center; line-height: var(--header-height); font-weight: bold;
            background-color: #f4f4f4; border-bottom: 1px solid var(--border-color); 
            box-sizing: border-box; position: sticky; top: 0; z-index: 25;
        }
        /* 土日の色 */
        .day-column:nth-child(6) .day-header { color: #007bff; background-color: #e3f2fd; }
        .day-column:nth-child(7) .day-header { color: #dc3545; background-color: #ffebee; }

        /* グリッド線 */
        .grid-line {
            height: var(--hour-height);
            border-top: 1px solid #eee; /* 上辺を基準線にする */
            box-sizing: border-box;
            position: relative;
        }
        /* 30分ごとの点線 */
        .grid-line::after {
            content: ""; display: block; position: absolute; top: 50%; width: 100%;
            border-bottom: 1px dotted #f9f9f9; pointer-events: none;
        }

        /* 予定カード */
        .event-card {
            position: absolute; left: 2px; right: 2px; 
            border-left: 4px solid;
            font-size: 11px; padding: 4px; border-radius: 4px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; transition: 0.1s; z-index: 10;
            box-sizing: border-box;
        }
        .event-card:hover { transform: scale(1.02); z-index: 15; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .event-time { font-size: 10px; opacity: 0.9; display: block; margin-bottom: 2px; font-weight: bold; }

        /* モーダル */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-top: 0; color: #444; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #666; font-size: 13px; }
        .form-group input[type="text"], .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px;
        }
        
        /* 時間入力UI修正：ブラウザ標準の矢印を消す */
        .time-wrapper {
            display: flex; align-items: center; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 5px;
        }
        .time-display {
            border: none; background: transparent; font-size: 20px; font-family: monospace; font-weight: bold;
            flex: 1; text-align: center; color: #333; outline: none; min-width: 0;
            appearance: none; -webkit-appearance: none; /* 標準スタイル無効化 */
        }
        
        /* ★重要：Chrome/Edgeでinput type="time"のアイコンを消すCSS */
        input[type="time"]::-webkit-calendar-picker-indicator {
            display: none; /* 完全に消す */
            -webkit-appearance: none;
        }

        .arrow-btn {
            width: 32px; height: 32px; background: #fff; border: 1px solid #ccc; border-radius: 4px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;
            color: #333; /* 矢印の色を黒に */
        }
        .arrow-btn:active { background: #ddd; }

        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* カテゴリ管理 */
        .category-list { list-style: none; padding: 0; margin: 0; }
        .category-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .cat-color-preview { width: 15px; height: 15px; border-radius: 3px; margin-right: 10px; display: inline-block; }
        .btn-sm-del { background: #e74c3c; color: white; border: none; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

    </style>
</head>
<body>

    <h1>📅 Weekly Routine</h1>
    
    <div class="controls">
        <button class="btn-add" onclick="openModal()">➕ 予定追加</button>
        <button class="btn-category" onclick="openCategoryModal()">⚙️ カテゴリ設定</button>
        <button class="btn-save" onclick="saveImage()">📷 画像保存</button>
        <button class="btn-clear" onclick="clearAll()">🗑️ 全削除</button>
    </div>

    <div class="schedule-wrapper" id="capture-target">
        <div class="schedule-container">
            <div class="time-column" id="timeColumn"></div>
            <div class="days-area" id="daysArea"></div>
        </div>
    </div>

    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <h2 id="modalTitle">予定の編集</h2>
            <input type="hidden" id="eventId">
            
            <div class="form-group">
                <label>タイトル</label>
                <input type="text" id="inputTitle" placeholder="例：会議、移動、ジム">
            </div>

            <div class="form-group">
                <label>カテゴリ (色)</label>
                <select id="inputCategory"></select>
                <div style="text-align:right; font-size:11px; margin-top:4px;">
                    <a href="#" onclick="closeModal(); openCategoryModal();" style="color:#4b6cb7; text-decoration:none;">カテゴリを追加・編集 &gt;</a>
                </div>
            </div>

            <div class="form-group">
                <label>曜日</label>
                <select id="inputDay">
                    <option value="0">Mon (月)</option>
                    <option value="1">Tue (火)</option>
                    <option value="2">Wed (水)</option>
                    <option value="3">Thu (木)</option>
                    <option value="4">Fri (金)</option>
                    <option value="5">Sat (土)</option>
                    <option value="6">Sun (日)</option>
                </select>
            </div>

            <div class="form-group">
                <label>開始時間</label>
                <div class="time-wrapper">
                    <button class="arrow-btn" onclick="stepTime('inputStart', -15)">▼</button>
                    <input type="time" id="inputStart" class="time-display" value="09:00">
                    <button class="arrow-btn" onclick="stepTime('inputStart', 15)">▲</button>
                </div>
            </div>

            <div class="form-group">
                <label>終了時間</label>
                <div class="time-wrapper">
                    <button class="arrow-btn" onclick="stepTime('inputEnd', -15)">▼</button>
                    <input type="time" id="inputEnd" class="time-display" value="10:00">
                    <button class="arrow-btn" onclick="stepTime('inputEnd', 15)">▲</button>
                </div>
            </div>

            <div class="modal-buttons">
                <button onclick="deleteEvent()" id="btnDelete" style="background:#e74c3c; color:white; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; display:none;">削除</button>
                <button onclick="closeModal()" style="background:#ccc; color:#333; border:none; padding:10px 15px; border-radius:4px; cursor:pointer;">キャンセル</button>
                <button onclick="saveEvent()" class="btn-add" style="border:none; padding:10px 20px; border-radius:4px; cursor:pointer; color:white;">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <h2>⚙️ カテゴリ設定</h2>
            <div class="form-group" style="display:flex; gap:5px;">
                <input type="text" id="newCatName" placeholder="新しいカテゴリ名" style="flex:1;">
                <input type="color" id="newCatColor" value="#3498db" style="width:40px; padding:0; height:42px; border:none; cursor:pointer;">
                <button onclick="addCategory()" style="background:#2ecc71; color:white; border:none; border-radius:4px; width:60px; cursor:pointer;">追加</button>
            </div>
            
            <p style="font-size:12px; color:#666;">登録済みカテゴリ:</p>
            <ul id="categoryList" class="category-list">
                </ul>

            <div class="modal-buttons">
                <button onclick="closeCategoryModal()" style="background:#4b6cb7; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        // 設定: 0:00 - 24:00 (24時間対応)
        const START_HOUR = 0;
        const END_HOUR = 24;
        const HOUR_HEIGHT = 50; 
        const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        
        let events = [];
        
        // デフォルトカテゴリ
        const DEFAULT_CATEGORIES = [
            { id: 'work', name: '仕事', color: '#3498db', bg: '#eaf4fc' },
            { id: 'mtg', name: '会議', color: '#e74c3c', bg: '#fdedec' },
            { id: 'study', name: '勉強', color: '#f1c40f', bg: '#fef9e7' },
            { id: 'private', name: '私用', color: '#2ecc71', bg: '#eafaf1' }
        ];
        let categories = [];

        function init() {
            loadCategories();
            renderGrid();
            loadEvents();
        }

        // --- カテゴリ管理 ---
        function loadCategories() {
            const data = localStorage.getItem('wr_categories');
            if (data) {
                categories = JSON.parse(data);
            } else {
                categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
            }
        }

        function saveCategories() {
            localStorage.setItem('wr_categories', JSON.stringify(categories));
            updateCategorySelect();
        }

        function addCategory() {
            const name = document.getElementById('newCatName').value.trim();
            const color = document.getElementById('newCatColor').value;
            if (!name) return;

            // 色を薄くした背景色
            const bg = adjustColor(color);

            categories.push({
                id: Date.now().toString(),
                name: name,
                color: color, 
                bg: bg
            });
            
            document.getElementById('newCatName').value = '';
            saveCategories();
            renderCategoryList();
        }

        function deleteCategory(id) {
            if (categories.length <= 1) {
                alert("カテゴリは最低1つ必要です");
                return;
            }
            if (!confirm("このカテゴリを削除しますか？")) return;
            categories = categories.filter(c => c.id !== id);
            saveCategories();
            renderCategoryList();
        }

        function adjustColor(hex) {
            // 背景用に透明度を下げる
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, 0.15)`;
        }

        function renderCategoryList() {
            const list = document.getElementById('categoryList');
            list.innerHTML = '';
            categories.forEach(cat => {
                const li = document.createElement('li');
                li.className = 'category-item';
                li.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="cat-color-preview" style="background:${cat.color}"></span>
                        ${cat.name}
                    </div>
                    <button class="btn-sm-del" onclick="deleteCategory('${cat.id}')">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function updateCategorySelect() {
            const select = document.getElementById('inputCategory');
            select.innerHTML = '';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                select.appendChild(opt);
            });
        }

        // --- グリッド描画 ---
        function renderGrid() {
            const timeCol = document.getElementById('timeColumn');
            const daysArea = document.getElementById('daysArea');

            // ヘッダー高さ調整用のスペーサー
            const spacer = document.createElement('div');
            spacer.className = 'time-header-spacer';
            timeCol.appendChild(spacer);

            for (let h = START_HOUR; h <= END_HOUR; h++) {
                const div = document.createElement('div');
                div.className = 'time-slot';
                if (h < END_HOUR) {
                    div.innerHTML = `<span>${h}:00</span>`;
                }
                timeCol.appendChild(div);
            }

            DAYS.forEach((day, index) => {
                const col = document.createElement('div');
                col.className = 'day-column';
                col.id = `day-col-${index}`;
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                col.appendChild(header);

                for (let h = START_HOUR; h < END_HOUR; h++) {
                    const grid = document.createElement('div');
                    grid.className = 'grid-line';
                    grid.onclick = () => openModalNew(index, `${h.toString().padStart(2,'0')}:00`);
                    col.appendChild(grid);
                }
                daysArea.appendChild(col);
            });
        }

        // --- 予定描画（修正版） ---
        function renderEvents() {
            document.querySelectorAll('.event-card').forEach(e => e.remove());

            events.forEach(ev => {
                const col = document.getElementById(`day-col-${ev.dayIndex}`);
                if(!col) return;
                
                let cat = categories.find(c => c.id === ev.categoryId);
                if (!cat) cat = categories[0] || DEFAULT_CATEGORIES[0];

                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `<span class="event-time">${ev.start} - ${ev.end}</span>${ev.title}`;
                
                const top = timeToPx(ev.start);
                const bottom = timeToPx(ev.end);
                
                // ★修正点: 高さから1px引くことで、次の枠線と被らないようにする
                // これで「11:00まで」の予定が「11:00開始」の線ギリギリで止まる
                const height = bottom - top;

                card.style.top = top + 'px'; 
                card.style.height = Math.max(height - 1, 15) + 'px'; 

                card.style.backgroundColor = cat.bg;
                card.style.borderLeftColor = cat.color;
                card.style.color = '#333'; 
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    openModalEdit(ev.id);
                };
                col.appendChild(card);
            });
        }

        // 時間 -> ピクセル変換 (ヘッダー40px分を考慮)
        function timeToPx(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return ((h - START_HOUR) * HOUR_HEIGHT) + ((m / 60) * HOUR_HEIGHT) + 40; 
        }

        // --- モーダル操作 ---
        const modal = document.getElementById('eventModal');
        const categoryModal = document.getElementById('categoryModal');

        function stepTime(inputId, minutes) {
            const input = document.getElementById(inputId);
            let [h, m] = input.value.split(':').map(Number);
            const date = new Date(); date.setHours(h); date.setMinutes(m + minutes);
            const newH = date.getHours().toString().padStart(2, '0');
            const newM = date.getMinutes().toString().padStart(2, '0');
            input.value = `${newH}:${newM}`;
        }

        function openModal() {
            document.getElementById('eventId').value = '';
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputDay').value = 0;
            document.getElementById('inputStart').value = '09:00';
            document.getElementById('inputEnd').value = '10:00';
            document.getElementById('btnDelete').style.display = 'none';
            document.getElementById('modalTitle').innerText = '✨ 新しい予定';
            updateCategorySelect();
            modal.style.display = 'flex';
        }

        function openModalNew(dayIndex, startTime) {
            openModal();
            document.getElementById('inputDay').value = dayIndex;
            document.getElementById('inputStart').value = startTime;
            const [h, m] = startTime.split(':').map(Number);
            let endH = h + 1;
            let endM = m;
            if (endH >= 24) endH = 0; 
            document.getElementById('inputEnd').value = `${endH.toString().padStart(2,'0')}:${endM.toString().padStart(2,'0')}`;
        }

        function openModalEdit(id) {
            const ev = events.find(e => e.id === id);
            if(!ev) return;
            updateCategorySelect();
            document.getElementById('eventId').value = ev.id;
            document.getElementById('inputTitle').value = ev.title;
            document.getElementById('inputDay').value = ev.dayIndex;
            document.getElementById('inputStart').value = ev.start;
            document.getElementById('inputEnd').value = ev.end;
            document.getElementById('inputCategory').value = ev.categoryId;
            document.getElementById('btnDelete').style.display = 'block';
            document.getElementById('modalTitle').innerText = '📝 予定の編集';
            modal.style.display = 'flex';
        }

        function closeModal() { modal.style.display = 'none'; }
        
        function openCategoryModal() {
            renderCategoryList();
            categoryModal.style.display = 'flex';
        }
        function closeCategoryModal() {
            categoryModal.style.display = 'none';
            updateCategorySelect();
        }

        function saveEvent() {
            const id = document.getElementById('eventId').value;
            const title = document.getElementById('inputTitle').value;
            const dayIndex = document.getElementById('inputDay').value;
            const start = document.getElementById('inputStart').value;
            const end = document.getElementById('inputEnd').value;
            const categoryId = document.getElementById('inputCategory').value;

            if(!title) { alert('タイトルを入力してください'); return; }
            if(start >= end) { alert('開始時間は終了時間より前に設定してください'); return; }

            if (id) {
                const index = events.findIndex(e => e.id == id);
                events[index] = { id: Number(id), dayIndex, start, end, title, categoryId };
            } else {
                events.push({ id: Date.now(), dayIndex, start, end, title, categoryId });
            }
            saveToLocal();
            renderEvents();
            closeModal();
        }

        function deleteEvent() {
            if(!confirm('本当に削除しますか？')) return;
            const id = document.getElementById('eventId').value;
            events = events.filter(e => e.id != id);
            saveToLocal();
            renderEvents();
            closeModal();
        }

        function saveToLocal() { localStorage.setItem('weeklyRoutineEvents', JSON.stringify(events)); }
        function loadEvents() {
            const data = localStorage.getItem('weeklyRoutineEvents');
            if(data) { events = JSON.parse(data); renderEvents(); }
        }
        function clearAll() {
            if(confirm("全ての予定を削除しますか？")) { events = []; saveToLocal(); renderEvents(); }
        }
        function saveImage() {
            html2canvas(document.getElementById('capture-target')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'weekly_routine.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        init();
    </script>
</body>
</html>
