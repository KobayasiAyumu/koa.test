<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weekly Routine</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; color: #333; padding: 20px; }
        h1 { text-align: center; }

        /* グリッドレイアウトの設定 */
        .timetable {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr); /* 時間軸 + 7曜日 */
            gap: 1px;
            background-color: #ddd; /* 枠線の色 */
            border: 1px solid #ddd;
            max-width: 1000px;
            margin: 0 auto;
        }

        .cell {
            background-color: white;
            min-height: 60px; /* マスの高さ */
            padding: 5px;
            font-size: 14px;
            cursor: pointer; /* クリックできる感 */
            transition: background 0.2s;
            white-space: pre-wrap; /* 改行を反映 */
        }

        .cell:hover { background-color: #f0f8ff; } /* マウスが乗った時 */
        
        /* ヘッダーと時間軸の見た目 */
        .header { background-color: #f4f4f4; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 40px; cursor: default;}
        .time-label { background-color: #fafafa; text-align: right; padding-right: 10px; color: #666; font-size: 12px; display: flex; align-items: center; justify-content: flex-end; cursor: default;}

        /* 入力済みセルのスタイル */
        .has-event {
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
        }
    </style>
</head>
<body>

    <h1>Weekly Routine</h1>
    <p style="text-align:center; font-size:0.9rem;">マスをクリックして予定を入力・削除できます</p>
    
    <div class="timetable" id="timetable"></div>

    <script>
        // === 設定 ===
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const startHour = 9;  // 9時から
        const endHour = 20;   // 20時まで表示

        const timetable = document.getElementById('timetable');

        // === 1. 初期化処理（画面を作る） ===
        function init() {
            // 左上の空白
            createCell('header', '');

            // 曜日ヘッダーの生成
            days.forEach(day => createCell('header', day));

            // 時間割の生成 (縦ループ: 時間, 横ループ: 曜日)
            for (let hour = startHour; hour <= endHour; hour++) {
                // 左側の時間表示
                createCell('time-label', `${hour}:00`);

                // 各曜日のセル
                days.forEach(day => {
                    const cellId = `${day}-${hour}`; // 例: Mon-9
                    const cell = createCell('cell', '');
                    cell.id = cellId; // IDをつける
                    
                    // クリックイベントを設定
                    cell.addEventListener('click', () => editSchedule(cellId));
                });
            }

            // 保存されたデータを読み込む
            loadSchedule();
        }

        // セルを作る補助関数
        function createCell(className, text) {
            const div = document.createElement('div');
            div.className = `cell ${className}`;
            div.textContent = text;
            timetable.appendChild(div);
            return div;
        }

        // === 2. 編集・保存機能 ===
        function editSchedule(id) {
            const cell = document.getElementById(id);
            const currentText = cell.innerText;
            
            // 入力ダイアログを出す
            const newText = prompt("予定を入力してください（空欄で削除）", currentText);

            // キャンセルされたら何もしない
            if (newText === null) return;

            // 画面を更新
            cell.innerText = newText;
            updateCellStyle(cell, newText);

            // データを保存
            saveSchedule(id, newText);
        }

        // 色付けの切り替え
        function updateCellStyle(cell, text) {
            if (text && text.trim() !== "") {
                cell.classList.add('has-event');
            } else {
                cell.classList.remove('has-event');
            }
        }

        // === 3. ローカルストレージ操作 ===
        // データ保存形式: { "Mon-9": "会議", "Tue-10": "授業" }
        
        function saveSchedule(id, text) {
            // 今のデータを取得
            let data = JSON.parse(localStorage.getItem('myRoutineData')) || {};
            
            if (text && text.trim() !== "") {
                data[id] = text; // 追加・更新
            } else {
                delete data[id]; // 削除
            }

            // JSON文字列にして保存
            localStorage.setItem('myRoutineData', JSON.stringify(data));
        }

        function loadSchedule() {
            const data = JSON.parse(localStorage.getItem('myRoutineData'));
            if (!data) return;

            // 保存されたキー（例: Mon-9）ごとに中身を復元
            Object.keys(data).forEach(id => {
                const cell = document.getElementById(id);
                if (cell) {
                    cell.innerText = data[id];
                    updateCellStyle(cell, data[id]);
                }
            });
        }

        // 実行開始
        init();
    </script>
</body>
</html>
