<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weekly Routine</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; color: #333; padding: 20px; background-color: #f9f9f9; }
        h1 { text-align: center; margin-bottom: 10px; }
        
        /* ボタンのエリア */
        .controls { text-align: center; margin-bottom: 20px; }
        button {
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-reset { background-color: #ef5350; }  /* 赤 */
        .btn-save { background-color: #4caf50; }   /* 緑 */

        /* スマホ対応：横スクロール用の枠 */
        .timetable-wrapper {
            overflow-x: auto; /* はみ出したらスクロール */
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch; /* スマホでのスクロールを滑らかに */
        }

        /* グリッドレイアウトの設定 */
        .timetable {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            gap: 1px;
            background-color: #ddd;
            border: 1px solid #ddd;
            /* スマホでも最低限の幅を確保（これ以上縮まない） */
            min-width: 800px; 
            max-width: 1000px;
            margin: 0 auto;
            background-color: white; /* 画像化するとき背景が黒くならないように */
        }

        .cell {
            background-color: white;
            min-height: 60px;
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: pre-wrap;
            word-wrap: break-word; /* 長い単語を折り返す */
        }

        .cell:hover { background-color: #f0f8ff; }
        
        .header { background-color: #f4f4f4; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 40px; cursor: default;}
        .time-label { background-color: #fafafa; text-align: right; padding-right: 10px; color: #666; font-size: 12px; display: flex; align-items: center; justify-content: flex-end; cursor: default;}

        .has-event {
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
            font-weight: bold;
        }

        /* スマホ向けの微調整 (画面幅が600px以下のとき) */
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.5rem; }
            .cell { font-size: 12px; min-height: 50px; } /* 少し文字を小さく */
        }
    </style>
</head>
<body>

    <h1>Weekly Routine</h1>
    
    <div class="controls">
        <button class="btn-save" onclick="downloadImage()">📷 画像として保存</button>
        <button class="btn-reset" onclick="clearSchedule()">🗑️ 全削除</button>
    </div>

    <p style="text-align:center; font-size:0.8rem; color:#666;">マスをクリックして入力 / 横にスクロールできます</p>
    
    <div class="timetable-wrapper">
        <div class="timetable" id="timetable"></div>
    </div>

    <script>
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const startHour = 9;
        const endHour = 20;
        const timetable = document.getElementById('timetable');

        function init() {
            createCell('header', '');
            days.forEach(day => createCell('header', day));

            for (let hour = startHour; hour <= endHour; hour++) {
                createCell('time-label', `${hour}:00`);
                days.forEach(day => {
                    const cellId = `${day}-${hour}`;
                    const cell = createCell('cell', '');
                    cell.id = cellId;
                    cell.addEventListener('click', () => editSchedule(cellId));
                });
            }
            loadSchedule();
        }

        function createCell(className, text) {
            const div = document.createElement('div');
            div.className = `cell ${className}`;
            div.textContent = text;
            timetable.appendChild(div);
            return div;
        }

        function editSchedule(id) {
            const cell = document.getElementById(id);
            const currentText = cell.innerText;
            const newText = prompt("予定を入力してください", currentText);
            if (newText === null) return;
            cell.innerText = newText;
            updateCellStyle(cell, newText);
            saveSchedule(id, newText);
        }

        function updateCellStyle(cell, text) {
            if (text && text.trim() !== "") {
                cell.classList.add('has-event');
            } else {
                cell.classList.remove('has-event');
            }
        }

        function saveSchedule(id, text) {
            let data = JSON.parse(localStorage.getItem('myRoutineData')) || {};
            if (text && text.trim() !== "") {
                data[id] = text;
            } else {
                delete data[id];
            }
            localStorage.setItem('myRoutineData', JSON.stringify(data));
        }

        function loadSchedule() {
            const data = JSON.parse(localStorage.getItem('myRoutineData'));
            if (!data) return;
            Object.keys(data).forEach(id => {
                const cell = document.getElementById(id);
                if (cell) {
                    cell.innerText = data[id];
                    updateCellStyle(cell, data[id]);
                }
            });
        }

        function clearSchedule() {
            if(confirm("本当に全ての予定を削除しますか？")) {
                localStorage.removeItem('myRoutineData');
                location.reload();
            }
        }

        // === 新機能：画像として保存 ===
        function downloadImage() {
            // スクリーンショットを撮る対象
            const target = document.getElementById('timetable');

            // html2canvasを使って画像化
            html2canvas(target).then(canvas => {
                // リンクタグを作ってクリックさせることでダウンロード
                const link = document.createElement('a');
                link.download = 'my_routine.png'; // ファイル名
                link.href = canvas.toDataURL(); // 画像データに変換
                link.click(); // 自動クリック
            });
        }

        init();
    </script>
</body>
</html>
